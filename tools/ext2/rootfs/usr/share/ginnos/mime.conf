# file types: the type name, the Tela icon, and how a file is found to be
# of the type. read by the mime library (src/lib/mime).
#
#   .ext          the name ends in .ext (letter case is ignored)
#   magic:BYTES   the file starts with these bytes; \xNN is a byte in hex
#   text          the first bytes are text (UTF-8 without control bytes)
#
# the name is checked first (the first type with that extension), then
# the first bytes (the first type whose magic matches), then text. a
# file that matches nothing is application/octet-stream, icon unknown.

# programs and scripts
application/x-executable   application-x-executable  magic:\x7FELF
text/x-script              text-x-script             .sh magic:#!
text/x-python              text-x-script             .py

# source code
text/x-csrc                text-x-csrc               .c .h
text/x-asm                 text-x-script             .s .asm
text/x-makefile            text-x-script             .mk

# images
image/png                  image-x-generic           .png magic:\x89PNG
image/jpeg                 image-x-generic           .jpg .jpeg magic:\xFF\xD8\xFF
image/bmp                  image-x-generic           .bmp magic:BM
image/x-portable-pixmap    image-x-generic           .ppm .pgm magic:P6 magic:P5

# sound
audio/wav                  audio-x-generic           .wav magic:RIFF

# archives and data
application/x-tar          application-x-archive     .tar
application/zip            application-x-archive     .zip magic:PK\x03\x04
application/gzip           application-x-archive     .gz magic:\x1F\x8B
application/x-doom-wad     doom                      .wad magic:IWAD magic:PWAD
font/ttf                   text-x-generic            .ttf

# text
text/markdown              text-x-generic            .md
text/plain                 text-x-generic            .txt .log .conf text
