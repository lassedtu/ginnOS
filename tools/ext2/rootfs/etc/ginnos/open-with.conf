# the programs that open files in the file manager (yggdrasil), by the
# file type (the types are in /usr/share/ginnos/mime.conf). change them
# for yourself in ~/.config/ginnos/open-with.conf.
#
#   type = command     %f is the file (at the end when it is not there)
#   kind/* = command   all types of a kind, such as text/*
#   * = command        all other types
#
# program files run without this table.

[open]
text/* = mimir ze %f
font/ttf = mimir ze %f
audio/wav = mimir -k play %f
application/x-doom-wad = doom -iwad %f
