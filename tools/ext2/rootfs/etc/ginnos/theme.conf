# the look of ginnOS (idunn). change it for yourself with
# "conf theme theme.<key> <value>": it goes to ~/.config/ginnos/theme.conf.

[theme]
# light or dark
mode = dark
# rose, blue, green, orange, violet, neutral, or a colour (#rrggbb)
accent = rose
# the size of body text: 13, 14 or 15
font_size = 13
# 1 or 2: all sizes
scale = 1
# false: no transitions
motion = true
# the base corner radius, 4 to 12
radius = 6

# a token can be changed for one mode, by its name, for example:
[light]
# border = #e4e4e7
[dark]
# background = #09090b
