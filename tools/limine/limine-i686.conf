# limine configuration for ginnOS (tools/limine/make_disk.py copies it to
# /boot/limine/limine.conf on the FAT boot partition).
#
# the kernel is a 32-bit multiboot 2 kernel. the root filesystem image is a
# module: the kernel uses it only if it does not find a ginnOS ext2
# partition on the ATA disk (for example, on a USB stick).

timeout: 1

/ginnOS
    protocol: multiboot2
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/rootfs.ext2
    module_string: rootfs
