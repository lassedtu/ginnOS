# limine configuration for the x86_64 ginnOS kernel (tools/limine/
# make_disk.py copies it to /boot/limine/limine.conf on the FAT boot
# partition).
#
# the kernel uses the limine boot protocol. the root filesystem image is a
# module: the kernel uses it only if it does not find a ginnOS ext2
# partition on the ATA disk (for example, on a USB stick).

timeout: 1

/ginnOS (x86_64)
    protocol: limine
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/rootfs.ext2
    module_string: rootfs
